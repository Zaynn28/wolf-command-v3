# Local development only. Postgres stays on localhost.
# The database password is a local placeholder, not a production secret.
# Start: docker compose up -d

name: wolf-command-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: wolf
      POSTGRES_DB: wolf_command
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wolf_postgres:/var/lib/postgresql/data

volumes:
  wolf_postgres:
